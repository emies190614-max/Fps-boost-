name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q RobloxFPSBooster.zip
      - run: |
          echo "android.useAndroidX=true" > RobloxFPSBooster/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> RobloxFPSBooster/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: cd RobloxFPSBooster && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: RobloxFPSBooster/app/build/outputs/apk/debug/app-debug.apk
          
